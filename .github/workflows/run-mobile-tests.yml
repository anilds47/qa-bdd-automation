name: Run Mobile Tests

on:
  workflow_dispatch:
    inputs:
      testng_xml:
        description: 'TestNG XML file path'
        required: true
        default: 'testng-bdd-appium.xml'

      devices:
        description: 'Device(s) to run on'
        required: true
        type: choice
        options:
          - all
          - redmi
          - emulator
          - samsung

jobs:
  # ── Job 1: Build the device matrix from JSON ─────────────────
  prepare:
    runs-on: self-hosted
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Build device matrix
        id: build-matrix
        shell: powershell
        run: |
          $selection = "${{ github.event.inputs.devices }}"
          $devices = Get-Content ".github/devices.json" | ConvertFrom-Json

          if ($selection -eq "all") {
            $filtered = $devices
          } else {
            $filtered = $devices | Where-Object { $_.id -eq $selection }
          }

          if (-not $filtered -or $filtered.Count -eq 0) {
            Write-Error "ERROR: No device matched selection '$selection'"
            exit 1
          }

          $matrix = @{ device = @($filtered) } | ConvertTo-Json -Compress -Depth 5
          echo "matrix=$matrix" >> $env:GITHUB_OUTPUT

          $filtered | ForEach-Object { Write-Host "  ✓ $($_.name) [$($_.udid)] Android $($_.version)" }

  # ── Job 2: Run tests in parallel across selected devices ─────
  test:
    needs: prepare
    runs-on: self-hosted
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Checkout private core repo
        uses: actions/checkout@v4
        with:
          repository: anilds47/qa-core-framework
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: core-framework

      - name: Build core framework
        shell: powershell
        run: cd core-framework; mvn clean install -DskipTests

      - name: Verify device connection
        shell: powershell
        run: adb devices

      - name: Run tests — ${{ matrix.device.name }}
        shell: powershell
        run: mvn clean test -DsuiteXmlFile="${{ github.workspace }}/${{ github.event.inputs.testng_xml }}" -Dudid="${{ matrix.device.udid }}" -DdeviceName="${{ matrix.device.name }}" -DplatformVersion="${{ matrix.device.version }}"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.device.id }}-${{ github.run_number }}
          path: target/