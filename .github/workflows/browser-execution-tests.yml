name: Run Browser Tests (Dynamic XML + Browser)

on:
  workflow_dispatch:
    inputs:
      testng_xml:
        description: 'Enter TestNG XML file path'
        required: true
        default: 'testng-bdd-web.xml'

      browser:
        description: 'Browser to run tests on'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox
          - edge

      headless:
        description: 'Run in headless mode?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  test:
    runs-on: windows-latest

    steps:
      # ✅ 1. Checkout PUBLIC repo (your test cases)
      - name: Checkout Public Repo
        uses: actions/checkout@v4

      # ✅ 2. Checkout PRIVATE repo (core framework)
      - name: Checkout Private Core Repo
        uses: actions/checkout@v4
        with:
          repository: anilds47/qa-core-framework
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: core-framework

      # ✅ 3. Set up JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ✅ 4. Cache Maven dependencies
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      # ✅ 5. Discover, Initialize and Start MySQL Service
      - name: Start MySQL Service
        run: |
          $mysqlBinPath = "C:\Program Files\MySQL\MySQL Server 8.0\bin"
          $mysqld    = "$mysqlBinPath\mysqld.exe"
          $mysql     = "$mysqlBinPath\mysql.exe"
          $dataDir   = "C:\MySQLData"

          Write-Host "=== Setting MYSQL_BIN env ==="
          echo "MYSQL_BIN=$mysqlBinPath" >> $env:GITHUB_ENV

          Write-Host "=== Creating data directory at $dataDir ==="
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null

          Write-Host "=== Initializing MySQL data directory ==="
          & $mysqld --initialize-insecure --datadir="$dataDir" --console
          Start-Sleep -Seconds 10

          Write-Host "=== Starting MySQL server ==="
          Start-Process -FilePath $mysqld -ArgumentList "--datadir=$dataDir --console" -NoNewWindow
          Start-Sleep -Seconds 15

          Write-Host "=== Pinging MySQL ==="
          $mysqladmin = "$mysqlBinPath\mysqladmin.exe"
          $retries = 10
          for ($i = 1; $i -le $retries; $i++) {
            Write-Host "Attempt $i of $retries..."
            & $mysqladmin -u root ping 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host "MySQL is ready!"
              break
            }
            if ($i -eq $retries) {
              Write-Error "MySQL did not become ready in time."
              exit 1
            }
            Start-Sleep -Seconds 5
          }
        shell: powershell

      # ✅ 6. Detect MySQL Binary Path
      - name: Detect MySQL Binary Path
        run: |
          $mysqlExe = Get-ChildItem "C:\Program Files\MySQL" -Recurse -Filter "mysql.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($mysqlExe) {
            Write-Host "MySQL binary found at: $($mysqlExe.FullName)"
            echo "MYSQL_BIN=$($mysqlExe.DirectoryName)" >> $env:GITHUB_ENV
          } else {
            Write-Error "mysql.exe not found under C:\Program Files\MySQL"
            exit 1
          }
        shell: powershell
      # ✅ 7. Wait for MySQL to be Ready
      - name: Wait for MySQL to be Ready
        run: |
          $mysqladmin = "$env:MYSQL_BIN\mysqladmin.exe"
          $retries = 10
          $ready = $false
          for ($i = 1; $i -le $retries; $i++) {
            Write-Host "Attempt $i of $retries - pinging MySQL..."
            & $mysqladmin -u root ping 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host "MySQL is ready!"
              $ready = $true
              break
            }
            Start-Sleep -Seconds 5
          }
          if (-not $ready) {
            Write-Host "MySQL did not become ready in time."
            exit 1
          }
        shell: powershell

      # ✅ 8. Configure MySQL — Set Password, Create DB and User
      - name: Configure MySQL
        run: |
          $mysql = "$env:MYSQL_BIN\mysql.exe"

          Write-Host "Setting root password..."
          & $mysql -u root -e "ALTER USER 'root'@'localhost' IDENTIFIED BY '${{ secrets.DB_PASSWORD }}';" 2>$null

          Write-Host "Creating database..."
          & $mysql -u root -p"${{ secrets.DB_PASSWORD }}" -e "CREATE DATABASE IF NOT EXISTS ${{ secrets.DB_NAME }};"

          Write-Host "Creating user..."
          & $mysql -u root -p"${{ secrets.DB_PASSWORD }}" -e "CREATE USER IF NOT EXISTS '${{ secrets.DB_USER }}'@'localhost' IDENTIFIED BY '${{ secrets.DB_PASSWORD }}';"

          Write-Host "Granting privileges..."
          & $mysql -u root -p"${{ secrets.DB_PASSWORD }}" -e "GRANT ALL PRIVILEGES ON ${{ secrets.DB_NAME }}.* TO '${{ secrets.DB_USER }}'@'localhost'; FLUSH PRIVILEGES;"

          Write-Host "MySQL configuration complete."
        shell: powershell

      # ✅ 9. Apply Schema / Seed SQL (if exists)
      - name: Run DB Schema / Seed Scripts
        run: |
          $mysql = "$env:MYSQL_BIN\mysql.exe"
          $schemaPath = "src/test/resources/db/schema.sql"
          if (Test-Path $schemaPath) {
            Write-Host "Applying schema from $schemaPath ..."
            & $mysql -u ${{ secrets.DB_USER }} -p"${{ secrets.DB_PASSWORD }}" ${{ secrets.DB_NAME }} < $schemaPath
            Write-Host "Schema applied successfully."
          } else {
            Write-Host "No schema.sql found at $schemaPath — skipping."
          }
        shell: powershell

      # ✅ 10. Build Core Framework
      - name: Build Core Framework
        run: |
          cd core-framework
          mvn clean install -DskipTests

      # ✅ 11. Install Selected Browser
      - name: Install Chrome
        if: ${{ inputs.browser == 'chrome' }}
        uses: browser-actions/setup-chrome@v1

      - name: Install Firefox
        if: ${{ inputs.browser == 'firefox' }}
        uses: browser-actions/setup-firefox@v1

      - name: Install Edge
        if: ${{ inputs.browser == 'edge' }}
        uses: browser-actions/setup-edge@v1

      # ✅ 12. Debug Inputs
      - name: Debug Inputs
        run: |
          echo "XML:      ${{ github.event.inputs.testng_xml }}"
          echo "Browser:  ${{ github.event.inputs.browser }}"
          echo "Headless: ${{ github.event.inputs.headless }}"
          echo "XML Path: ${{ github.workspace }}/${{ github.event.inputs.testng_xml }}"

      # ✅ 13. Run Tests
      - name: Run Tests
        run: mvn clean test -DsuiteXmlFile=${{ github.workspace }}/${{ inputs.testng_xml }} -Dbrowser=${{ inputs.browser }} -Dheadless=${{ inputs.headless }}
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      # ✅ 14. Upload Extent Report artifact
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report-${{ github.run_number }}
          path: target/
          retention-days: 30

      # ✅ 15. Post Report Link to Job Summary
      - name: Post Report Link to Summary
        if: always()
        run: |
          echo "## 📊 Browser Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Input        | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **XML File** | \`${{ inputs.testng_xml }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Browser**  | ${{ inputs.browser }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Headless** | ${{ inputs.headless }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 **[Download Extent Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})**" >> $GITHUB_STEP_SUMMARY