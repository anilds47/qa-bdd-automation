name: Run Browser Tests (Dynamic XML + Browser)

on:
  workflow_dispatch:
    inputs:
      testng_xml:
        description: 'Enter TestNG XML file path'
        required: true
        default: 'testng-bdd-web.xml'

      browser:
        description: 'Browser to run tests on'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox
          - edge

      headless:
        description: 'Run in headless mode?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  test:
    runs-on: windows-latest
    env:
      JAVA_TOOL_OPTIONS: "-Dotel.java.global-autoconfigure.enabled=true"
      OTEL_METRICS_EXPORTER: "none"
      OTEL_TRACES_EXPORTER: "none"

    steps:
      # ✅ 1. Checkout PUBLIC repo (your test cases)
      - name: Checkout Public Repo
        uses: actions/checkout@v4

      # ✅ 2. Checkout PRIVATE repo (core framework)
      - name: Checkout Private Core Repo
        uses: actions/checkout@v4
        with:
          repository: anilds47/qa-core-framework
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: core-framework

      # ✅ 3. Set up JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ✅ 4. Cache Maven dependencies
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      # ✅ 5. Initialize, Start and Verify MySQL
      - name: Setup and Start MySQL
        run: |
          $mysqlBin  = "C:\Program Files\MySQL\MySQL Server 8.0\bin"
          $mysqld    = "$mysqlBin\mysqld.exe"
          $mysqladmin = "$mysqlBin\mysqladmin.exe"
          $mysql     = "$mysqlBin\mysql.exe"
          $dataDir   = "C:\MySQLData"

          # Export bin path for later steps
          echo "MYSQL_BIN=$mysqlBin" >> $env:GITHUB_ENV

          Write-Host "=== Step 1: Creating data directory ==="
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null

          Write-Host "=== Step 2: Initializing MySQL ==="
          & $mysqld --initialize-insecure --datadir="$dataDir" --console
          Write-Host "Init exit code: $LASTEXITCODE"
          Start-Sleep -Seconds 5

          Write-Host "=== Step 3: Starting MySQL server ==="
          $proc = Start-Process -FilePath $mysqld `
            -ArgumentList "--datadir=$dataDir --port=3306 --bind-address=127.0.0.1 --console" `
            -NoNewWindow -PassThru
          Write-Host "mysqld PID: $($proc.Id)"

          Write-Host "=== Step 4: Waiting for MySQL to be ready ==="
          $ready = $false
          for ($i = 1; $i -le 20; $i++) {
            Start-Sleep -Seconds 5
            Write-Host "Ping attempt $i of 20..."
            $ping = & $mysqladmin -u root --connect-timeout=3 ping 2>&1
            Write-Host "Result: $ping"
            if ($LASTEXITCODE -eq 0) {
              Write-Host "MySQL is ready!"
              $ready = $true
              break
            }
          }

          if (-not $ready) {
            Write-Host "MySQL failed to start. Dumping mysqld output..."
            Get-EventLog -LogName Application -Source "MySQL*" -Newest 20 -ErrorAction SilentlyContinue
            exit 1
          }

          Write-Host "=== Step 5: Setting root password ==="
          & $mysql -u root --connect-expired-password -e "ALTER USER 'root'@'localhost' IDENTIFIED BY '${{ secrets.DB_PASSWORD }}';"

          Write-Host "=== Step 6: Creating DB and user ==="
          & $mysql -u root -p"${{ secrets.DB_PASSWORD }}" -e "CREATE DATABASE IF NOT EXISTS ${{ secrets.DB_NAME }};"
          & $mysql -u root -p"${{ secrets.DB_PASSWORD }}" -e "CREATE USER IF NOT EXISTS '${{ secrets.DB_USER }}'@'localhost' IDENTIFIED BY '${{ secrets.DB_PASSWORD }}';"
          & $mysql -u root -p"${{ secrets.DB_PASSWORD }}" -e "GRANT ALL PRIVILEGES ON ${{ secrets.DB_NAME }}.* TO '${{ secrets.DB_USER }}'@'localhost'; FLUSH PRIVILEGES;"

          Write-Host "MySQL setup complete!"
        shell: powershell
      # ✅ 9. Apply Schema / Seed SQL (if exists)
      - name: Run DB Schema / Seed Scripts
        run: |
          $mysql = "$env:MYSQL_BIN\mysql.exe"
          $schemaPath = "src/test/resources/db/schema.sql"
          if (Test-Path $schemaPath) {
            Write-Host "Applying schema from $schemaPath ..."
            $sql = Get-Content $schemaPath -Raw
            $sql | & $mysql -u ${{ secrets.DB_USER }} -p"${{ secrets.DB_PASSWORD }}" ${{ secrets.DB_NAME }}
            Write-Host "Schema applied successfully."
          } else {
            Write-Host "No schema.sql found at $schemaPath - skipping."
          }
        shell: powershell

      # ✅ 10. Build Core Framework
      - name: Build Core Framework
        run: |
          cd core-framework
          mvn clean install -DskipTests

      # ✅ 11. Install Selected Browser
      - name: Install Chrome
        if: ${{ inputs.browser == 'chrome' }}
        uses: browser-actions/setup-chrome@v1

      - name: Install Firefox
        if: ${{ inputs.browser == 'firefox' }}
        uses: browser-actions/setup-firefox@v1

      - name: Install Edge
        if: ${{ inputs.browser == 'edge' }}
        uses: browser-actions/setup-edge@v1

      # ✅ 12. Debug Inputs
      - name: Debug Inputs
        run: |
          echo "XML:      ${{ github.event.inputs.testng_xml }}"
          echo "Browser:  ${{ github.event.inputs.browser }}"
          echo "Headless: ${{ github.event.inputs.headless }}"
          echo "XML Path: ${{ github.workspace }}/${{ github.event.inputs.testng_xml }}"

      # ✅ 13. Run Tests
      - name: Run Tests
        run: mvn clean test -DsuiteXmlFile=${{ github.workspace }}/${{ inputs.testng_xml }} -Dbrowser=${{ inputs.browser }} -Dheadless=${{ inputs.headless }}
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      # ✅ 14. Upload Extent Report artifact
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report-${{ github.run_number }}
          path: target/
          retention-days: 30

      # ✅ 15. Post Report Link to Job Summary
      - name: Post Report Link to Summary
        if: always()
        run: |
          echo "## 📊 Browser Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Input        | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **XML File** | \`${{ inputs.testng_xml }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Browser**  | ${{ inputs.browser }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Headless** | ${{ inputs.headless }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 **[Download Extent Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})**" >> $GITHUB_STEP_SUMMARY