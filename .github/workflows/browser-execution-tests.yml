name: Run Browser Tests (Dynamic XML + Browser)

on:
  workflow_dispatch:
    inputs:
      testng_xml:
        description: 'Enter TestNG XML file path'
        required: true
        default: 'testng-bdd-web.xml'

      browser:
        description: 'Browser to run tests on'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox
          - edge

      headless:
        description: 'Run in headless mode?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  test:
    runs-on: windows-latest

    steps:
      # ✅ 1. Checkout PUBLIC repo (your test cases)
      - name: Checkout Public Repo
        uses: actions/checkout@v4

      # ✅ 2. Checkout PRIVATE repo (core framework)
      - name: Checkout Private Core Repo
        uses: actions/checkout@v4
        with:
          repository: anilds47/qa-core-framework
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: core-framework

      # ✅ 3. Set up JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ✅ 4. Cache Maven dependencies
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      # ✅ 5. Install and Start MySQL (Windows runner — no service containers)
      - name: Install MySQL
        run: |
          choco install mysql --version=8.0.36 -y
          & "C:\tools\mysql\current\bin\mysqld.exe" --install
          Start-Service MySQL
        shell: powershell

      - name: Wait for MySQL to be ready
        run: |
          $retries = 10
          for ($i = 0; $i -lt $retries; $i++) {
            try {
              & "C:\tools\mysql\current\bin\mysqladmin.exe" -u root ping 2>$null
              if ($LASTEXITCODE -eq 0) {
                Write-Host "MySQL is ready!"
                break
              }
            } catch {}
            Write-Host "Waiting for MySQL... attempt $($i+1)"
            Start-Sleep -Seconds 5
          }
        shell: powershell

      - name: Configure MySQL — Create DB and User
        run: |
          & "C:\tools\mysql\current\bin\mysql.exe" -u root -e "ALTER USER 'root'@'localhost' IDENTIFIED BY '${{ secrets.DB_PASSWORD }}';"
          & "C:\tools\mysql\current\bin\mysql.exe" -u root -p"${{ secrets.DB_PASSWORD }}" -e "CREATE DATABASE IF NOT EXISTS ${{ secrets.DB_NAME }};"
          & "C:\tools\mysql\current\bin\mysql.exe" -u root -p"${{ secrets.DB_PASSWORD }}" -e "CREATE USER IF NOT EXISTS '${{ secrets.DB_USER }}'@'localhost' IDENTIFIED BY '${{ secrets.DB_PASSWORD }}';"
          & "C:\tools\mysql\current\bin\mysql.exe" -u root -p"${{ secrets.DB_PASSWORD }}" -e "GRANT ALL PRIVILEGES ON ${{ secrets.DB_NAME }}.* TO '${{ secrets.DB_USER }}'@'localhost'; FLUSH PRIVILEGES;"
        shell: powershell

      - name: Run DB Schema / Seed Scripts (if any)
        run: |
          if (Test-Path "src/test/resources/db/schema.sql") {
            & "C:\tools\mysql\current\bin\mysql.exe" -u ${{ secrets.DB_USER }} -p"${{ secrets.DB_PASSWORD }}" ${{ secrets.DB_NAME }} < src/test/resources/db/schema.sql
            Write-Host "Schema applied."
          } else {
            Write-Host "No schema.sql found, skipping."
          }
        shell: powershell

      # ✅ 6. Build Core Framework
      - name: Build Core Framework
        run: |
          cd core-framework
          mvn clean install -DskipTests

      # ✅ 7. Install Selected Browser
      - name: Install Chrome
        if: ${{ inputs.browser == 'chrome' }}
        uses: browser-actions/setup-chrome@v1

      - name: Install Firefox
        if: ${{ inputs.browser == 'firefox' }}
        uses: browser-actions/setup-firefox@v1

      - name: Install Edge
        if: ${{ inputs.browser == 'edge' }}
        uses: browser-actions/setup-edge@v1

      # ✅ 8. Debug Inputs
      - name: Debug Inputs
        run: |
          echo "XML:      ${{ github.event.inputs.testng_xml }}"
          echo "Browser:  ${{ github.event.inputs.browser }}"
          echo "Headless: ${{ github.event.inputs.headless }}"
          echo "XML Path: ${{ github.workspace }}/${{ github.event.inputs.testng_xml }}"

      # ✅ 9. Run Tests (Dynamic XML + Browser + DB Config)
      - name: Run Tests
        run: mvn clean test -DsuiteXmlFile=${{ github.workspace }}/${{ inputs.testng_xml }} -Dbrowser=${{ inputs.browser }} -Dheadless=${{ inputs.headless }}
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      # ✅ 10. Upload Extent Report artifact
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report-${{ github.run_number }}
          path: target/
          retention-days: 30

      # ✅ 11. Post Report Link to Job Summary
      - name: Post Report Link to Summary
        if: always()
        run: |
          echo "## 📊 Browser Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Input        | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **XML File** | \`${{ inputs.testng_xml }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Browser**  | ${{ inputs.browser }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Headless** | ${{ inputs.headless }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 **[Download Extent Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})**" >> $GITHUB_STEP_SUMMARY