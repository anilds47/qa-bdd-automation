name: Run Browser Tests (Dynamic XML + Browser)

on:
  workflow_dispatch:
    inputs:
      testng_xml:
        description: 'Enter TestNG XML file path'
        required: true
        default: 'testng-bdd-web.xml'

      browser:
        description: 'Browser to run tests on'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox
          - edge

      headless:
        description: 'Run in headless mode?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  test:
    runs-on: windows-latest

    env:
      JAVA_TOOL_OPTIONS: "-Dotel.java.global-autoconfigure.enabled=true"
      OTEL_METRICS_EXPORTER: "none"
      OTEL_TRACES_EXPORTER: "none"

      JIRA_TOKEN: ${{ secrets.PRIVATE_JIRA_TOKEN }}
      GITHUB_WORKSPACE: ${{ github.workspace }}

      # ✅ Force GitHub Actions to use Node 24
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      # ⚠️ Temporary fallback if some actions fail
      # ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:

      # ✅ 1. Checkout PUBLIC repo
      - name: Checkout Public Repo
        uses: actions/checkout@v4

      # ✅ 2. Checkout PRIVATE repo
      - name: Checkout Private Core Repo
        uses: actions/checkout@v4
        with:
          repository: anilds47/qa-core-framework
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: core-framework

      # ✅ 3. Setup Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ✅ 4. Cache Maven dependencies
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\.m2\repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # ✅ 5. Build Core Framework
      - name: Build Core Framework
        shell: pwsh
        run: |
          cd core-framework
          mvn clean install -DskipTests

      # ✅ 6. Install Browser
      - name: Install Chrome
        if: ${{ inputs.browser == 'chrome' }}
        uses: browser-actions/setup-chrome@v1

      - name: Install Firefox
        if: ${{ inputs.browser == 'firefox' }}
        uses: browser-actions/setup-firefox@v1

      - name: Install Edge
        if: ${{ inputs.browser == 'edge' }}
        uses: browser-actions/setup-edge@v1

      # ✅ 7. Debug Inputs
      - name: Debug Inputs
        shell: pwsh
        run: |
          Write-Host "XML:      ${{ inputs.testng_xml }}"
          Write-Host "Browser:  ${{ inputs.browser }}"
          Write-Host "Headless: ${{ inputs.headless }}"
          Write-Host "Workspace: ${{ github.workspace }}"

      # ✅ 8. Run Tests
      - name: Run Tests
        shell: pwsh
        run: |
          mvn clean test -DsuiteXmlFile=${{ github.workspace }}/${{ inputs.testng_xml }} -Dbrowser=${{ inputs.browser }} -Dheadless=${{ inputs.headless }} -DjiraToken="${{ secrets.PRIVATE_JIRA_TOKEN }}"

      # ✅ 9. Upload Target Reports
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: target/
          retention-days: 30

      # ✅ 10. Upload Failed Screenshots
      - name: Upload Failed Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failed-screenshots-${{ github.run_number }}
          path: HtmlReports/FailedScreenshots/
          retention-days: 30
          if-no-files-found: ignore

      # ✅ 11. Upload Extent Report
      - name: Upload Extent Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report-${{ github.run_number }}
          path: HtmlReports/Reports/
          retention-days: 30
          if-no-files-found: ignore

      # ✅ 12. Add Summary
      - name: Post Report Link to Summary
        if: always()
        shell: pwsh
        run: |
          echo "## 📊 Browser Test Report" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "| Input | Value |" >> $env:GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $env:GITHUB_STEP_SUMMARY
          echo "| XML File | \`${{ inputs.testng_xml }}\` |" >> $env:GITHUB_STEP_SUMMARY
          echo "| Browser | ${{ inputs.browser }} |" >> $env:GITHUB_STEP_SUMMARY
          echo "| Headless | ${{ inputs.headless }} |" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "📥 Download reports from workflow artifacts." >> $env:GITHUB_STEP_SUMMARY