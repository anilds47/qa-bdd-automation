name: Run Mobile Tests (Multi-Device JSON)

on:
  workflow_dispatch:
    inputs:
      testng_xml:
        description: 'Enter TestNG XML file path'
        required: true
        default: 'testng-bdd-appium.xml'

      devices:
        description: 'Devices JSON (UDID, deviceName, platformVersion)'
        required: true
        default: |
          [
            {
              "udid": "a443a697",
              "deviceName": "Redmi Note 10 Pro",
              "platformVersion": "13"
            },
            {
              "udid": "emulator-5554",
              "deviceName": "Pixel Emulator",
              "platformVersion": "33"
            }
          ]

jobs:
  test:
    runs-on: self-hosted

    steps:
      # =========================
      # 1. Checkout PUBLIC repo
      # =========================
      - name: Checkout Public Repo
        uses: actions/checkout@v4

      # =========================
      # 2. Checkout PRIVATE repo (framework)
      # =========================
      - name: Checkout Private Core Repo
        uses: actions/checkout@v4
        with:
          repository: anilds47/qa-core-framework
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: core-framework

      # =========================
      # 3. Build Core Framework
      # =========================
      - name: Build Core Framework
        run: |
          cd core-framework
          mvn clean install -DskipTests

      # =========================
      # 4. Verify Device Connection
      # =========================
      - name: Check Connected Devices
        run: adb devices

      # =========================
      # 5. Debug Inputs
      # =========================
      - name: Debug Inputs
        run: |
          echo "TestNG XML: ${{ github.event.inputs.testng_xml }}"
          echo "Devices JSON: ${{ github.event.inputs.devices }}"

      # =========================
      # 6. Install jq (for JSON parsing)
      # =========================
      - name: Install jq (if not present)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      # =========================
      # 7. Run Tests on Multiple Devices
      # =========================
      - name: Execute Tests on All Devices
        run: |
          echo '${{ github.event.inputs.devices }}' > devices.json

          for row in $(jq -c '.[]' devices.json); do

            udid=$(echo $row | jq -r '.udid')
            deviceName=$(echo $row | jq -r '.deviceName')
            platformVersion=$(echo $row | jq -r '.platformVersion')

            echo "========================================"
            echo "Running on Device: $deviceName"
            echo "UDID: $udid"
            echo "Android Version: $platformVersion"
            echo "========================================"
            mvn clean test -DsuiteXmlFile=${{ github.workspace }}/${{ github.event.inputs.testng_xml }} -Dudid=$udid -DdeviceName="$deviceName" -DplatformVersion=$platformVersion

          done

      # =========================
      # 8. Upload Reports
      # =========================
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/