name: Run Mobile Tests (Multi-Device JSON)

# ============================================================
# HOW TO ADD A NEW DEVICE:
#   1. Add a new boolean input below  (e.g. run_oneplus)
#   2. Add a new step in "Execute Tests" section at the bottom
#      copying the pattern of the existing device steps.
#   That's it — no JSON editing, no index tracking.
# ============================================================

on:
  workflow_dispatch:
    inputs:

      testng_xml:
        description: 'Enter TestNG XML file path'
        required: true
        default: 'testng-bdd-appium.xml'

      # ── Device toggles ──────────────────────────────────────
      # Set default: true  → pre-checked in UI
      # Set default: false → unchecked in UI
      # To add a device: copy one block and update name + description

      run_redmi:
        description: 'Run on Redmi Note 10 Pro (UDID: a443a697 | Android 13)'
        type: boolean
        default: false

      run_emulator:
        description: 'Run on Pixel Emulator (UDID: emulator-5554 | Android 33)'
        type: boolean
        default: false

      run_samsung:
        description: 'Run on Samsung Galaxy S23 (UDID: RF8N30YXXXX | Android 14)'
        type: boolean
        default: false

      # ── ADD MORE DEVICES BELOW ───────────────────────────────
      # run_oneplus:
      #   description: 'Run on OnePlus 11 (UDID: YOUR_UDID | Android 13)'
      #   type: boolean
      #   default: false

jobs:
  test:
    runs-on: self-hosted

    steps:
      # =========================
      # 1. Validate — at least one device must be selected
      # =========================
      - name: Validate Device Selection
        run: |
          REDMI="${{ github.event.inputs.run_redmi }}"
          EMULATOR="${{ github.event.inputs.run_emulator }}"
          SAMSUNG="${{ github.event.inputs.run_samsung }}"
          # Add new device variables here when you add a device

          if [ "$REDMI" != "true" ] && [ "$EMULATOR" != "true" ] && [ "$SAMSUNG" != "true" ]; then
            echo "============================================"
            echo "ERROR: No device selected!"
            echo "Please enable at least one device toggle."
            echo "============================================"
            exit 1
          fi

          echo "Selected devices:"
          [ "$REDMI"    = "true" ] && echo "  ✓ Redmi Note 10 Pro"
          [ "$EMULATOR" = "true" ] && echo "  ✓ Pixel Emulator"
          [ "$SAMSUNG"  = "true" ] && echo "  ✓ Samsung Galaxy S23"

      # =========================
      # 2. Checkout PUBLIC repo
      # =========================
      - name: Checkout Public Repo
        uses: actions/checkout@v4

      # =========================
      # 3. Checkout PRIVATE repo (framework)
      # =========================
      - name: Checkout Private Core Repo
        uses: actions/checkout@v4
        with:
          repository: anilds47/qa-core-framework
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: core-framework

      # =========================
      # 4. Build Core Framework
      # =========================
      - name: Build Core Framework
        run: |
          cd core-framework
          mvn clean install -DskipTests

      # =========================
      # 5. Verify Device Connection
      # =========================
      - name: Check Connected Devices
        run: adb devices

      # =========================
      # 6. Run — Redmi Note 10 Pro
      # =========================
      - name: 'Test on Redmi Note 10 Pro'
        if: ${{ github.event.inputs.run_redmi == 'true' }}
        run: |
          echo "========================================"
          echo "  Device  : Redmi Note 10 Pro"
          echo "  UDID    : a443a697"
          echo "  Android : 13"
          echo "========================================"
          mvn clean test \
            -DsuiteXmlFile="${{ github.workspace }}/${{ github.event.inputs.testng_xml }}" \
            -Dudid="a443a697" \
            -DdeviceName="Redmi Note 10 Pro" \
            -DplatformVersion="13"

      # =========================
      # 7. Run — Pixel Emulator
      # =========================
      - name: 'Test on Pixel Emulator'
        if: ${{ github.event.inputs.run_emulator == 'true' }}
        run: |
          echo "========================================"
          echo "  Device  : Pixel Emulator"
          echo "  UDID    : emulator-5554"
          echo "  Android : 33"
          echo "========================================"
          mvn clean test \
            -DsuiteXmlFile="${{ github.workspace }}/${{ github.event.inputs.testng_xml }}" \
            -Dudid="emulator-5554" \
            -DdeviceName="Pixel Emulator" \
            -DplatformVersion="33"

      # =========================
      # 8. Run — Samsung Galaxy S23
      # =========================
      - name: 'Test on Samsung Galaxy S23'
        if: ${{ github.event.inputs.run_samsung == 'true' }}
        run: |
          echo "========================================"
          echo "  Device  : Samsung Galaxy S23"
          echo "  UDID    : RF8N30YXXXX"
          echo "  Android : 14"
          echo "========================================"
          mvn clean test \
            -DsuiteXmlFile="${{ github.workspace }}/${{ github.event.inputs.testng_xml }}" \
            -Dudid="RF8N30YXXXX" \
            -DdeviceName="Samsung Galaxy S23" \
            -DplatformVersion="14"

      # ── ADD NEW DEVICE STEP BELOW ──────────────────────────
      # - name: 'Test on OnePlus 11'
      #   if: ${{ github.event.inputs.run_oneplus == 'true' }}
      #   run: |
      #     echo "========================================"
      #     echo "  Device  : OnePlus 11"
      #     echo "  UDID    : YOUR_UDID"
      #     echo "  Android : 13"
      #     echo "========================================"
      #     mvn clean test \
      #       -DsuiteXmlFile="${{ github.workspace }}/${{ github.event.inputs.testng_xml }}" \
      #       -Dudid="YOUR_UDID" \
      #       -DdeviceName="OnePlus 11" \
      #       -DplatformVersion="13"

      # =========================
      # 9. Upload Reports
      # =========================
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: target/