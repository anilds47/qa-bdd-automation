name: Run Mobile Tests (Dynamic XML + Device)

on:
  workflow_dispatch:
    inputs:
      testng_xml:
        description: 'Enter TestNG XML file path'
        required: true
        default: 'testng-bdd-appium.xml'

      udid:
        description: 'Device UDID'
        required: true
        default: 'a443a697'

      device_name:
        description: 'Device Name'
        required: true
        default: 'Redmi Note 10 Pro'

      platform_version:
        description: 'Android Version'
        required: true
        default: '13'

jobs:
  test:
    runs-on: self-hosted

    steps:
      # ✅ 1. Checkout PUBLIC repo (your test cases)
      - name: Checkout Public Repo
        uses: actions/checkout@v4

      # ✅ 2. Checkout PRIVATE repo (core framework)
      - name: Checkout Private Core Repo
        uses: actions/checkout@v4
        with:
          repository: anilds47/qa-core-framework
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: core-framework

      # ✅ 3. Build Core Framework
      - name: Build Core Framework
        run: |
          cd core-framework
          mvn clean install -DskipTests

      # ✅ 4. Verify Device Connected
      - name: Check Connected Devices
        run: |
          adb devices
      - name: Debug Inputs
        run: |
          
          echo "XML: ${{ github.event.inputs.testng_xml }}"
          echo "UDID: ${{ github.event.inputs.udid }}"
          echo "Device: ${{ github.event.inputs.device_name }}"
          echo "Platform: ${{ github.event.inputs.platform_version }}"
          echo "Constructed XML Path: ${{ github.workspace }}/testng-bdd-appium.xml"

      # ✅ 5. Run Tests (Dynamic XML + Device Config)
      - name: Run Tests
        run: |
          cd core-framework
          mvn clean test 
            -DsuiteXmlFile=${{ github.workspace }}/testng-bdd-appium.xml 
            -Dudid=${{ inputs.udid }} 
            -DdeviceName=${{ inputs.device_name }}
            -DplatformVersion=${{ inputs.platform_version }}
      # ✅ 6. Upload Reports (optional but recommended)
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/