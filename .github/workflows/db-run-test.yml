name: DB Connection + Browser Tests

on:
  workflow_dispatch:
    inputs:
      testng_xml:
        description: 'Enter TestNG XML file path'
        required: true
        default: 'testng-bdd-web.xml'

      browser:
        description: 'Browser to run tests on'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox
          - edge

      headless:
        description: 'Run in headless mode?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  test:
    runs-on: self-hosted

    steps:
      # ✅ 1. Checkout PUBLIC repo (your test cases)
      - name: Checkout Public Repo
        uses: actions/checkout@v4

      # ✅ 2. Checkout PRIVATE repo (core framework)
      - name: Checkout Private Core Repo
        uses: actions/checkout@v4
        with:
          repository: anilds47/qa-core-framework
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: core-framework

      # ✅ 3. Set up JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ✅ 4. Cache Maven dependencies
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      # ✅ 5. Verify MySQL is already running on local machine
      - name: Verify MySQL is Running
        run: |
          echo "Checking MySQL connectivity..."
          until mysqladmin ping -h 127.0.0.1 -P 3306 -u ${{ secrets.DB_USER }} -p${{ secrets.DB_PASSWORD }} --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done
          echo "MySQL is ready!"

      # ✅ 6. Ensure DB and User exist
      - name: Configure MySQL
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -p${{ secrets.DB_ROOT_PASSWORD }} -e "CREATE DATABASE IF NOT EXISTS ${{ secrets.DB_NAME }};"
          mysql -h 127.0.0.1 -P 3306 -u root -p${{ secrets.DB_ROOT_PASSWORD }} -e "CREATE USER IF NOT EXISTS '${{ secrets.DB_USER }}'@'localhost' IDENTIFIED BY '${{ secrets.DB_PASSWORD }}';"
          mysql -h 127.0.0.1 -P 3306 -u root -p${{ secrets.DB_ROOT_PASSWORD }} -e "GRANT ALL PRIVILEGES ON ${{ secrets.DB_NAME }}.* TO '${{ secrets.DB_USER }}'@'localhost'; FLUSH PRIVILEGES;"
          echo "DB configured successfully."

      # ✅ 7. Apply Schema if exists
      - name: Run DB Schema / Seed Scripts
        run: |
          SCHEMA_PATH="src/test/resources/db/schema.sql"
          if [ -f "$SCHEMA_PATH" ]; then
            echo "Applying schema from $SCHEMA_PATH ..."
            mysql -h 127.0.0.1 -P 3306 -u ${{ secrets.DB_USER }} -p${{ secrets.DB_PASSWORD }} ${{ secrets.DB_NAME }} < $SCHEMA_PATH
            echo "Schema applied successfully."
          else
            echo "No schema.sql found - skipping."
          fi

      # ✅ 8. Build Core Framework
      - name: Build Core Framework
        run: |
          cd core-framework
          mvn clean install -DskipTests

      # ✅ 9. Install Selected Browser
      - name: Install Chrome
        if: ${{ inputs.browser == 'chrome' }}
        uses: browser-actions/setup-chrome@v1

      - name: Install Firefox
        if: ${{ inputs.browser == 'firefox' }}
        uses: browser-actions/setup-firefox@v1

      - name: Install Edge
        if: ${{ inputs.browser == 'edge' }}
        uses: browser-actions/setup-edge@v1

      # ✅ 10. Debug Inputs
      - name: Debug Inputs
        run: |
          echo "XML:      ${{ github.event.inputs.testng_xml }}"
          echo "Browser:  ${{ github.event.inputs.browser }}"
          echo "Headless: ${{ github.event.inputs.headless }}"
          echo "XML Path: ${{ github.workspace }}/${{ github.event.inputs.testng_xml }}"

      # ✅ 11. Run Tests
      - name: Run Tests
        run: mvn clean test -DsuiteXmlFile=${{ github.workspace }}/${{ inputs.testng_xml }} -Dbrowser=${{ inputs.browser }} -Dheadless=${{ inputs.headless }}
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      # ✅ 12. Upload Extent Report artifact
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report-${{ github.run_number }}
          path: target/
          retention-days: 30

      # ✅ 13. Post Report Link to Job Summary
      - name: Post Report Link to Summary
        if: always()
        run: |
          echo "## 📊 Browser Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Input        | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **XML File** | \`${{ inputs.testng_xml }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Browser**  | ${{ inputs.browser }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Headless** | ${{ inputs.headless }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 **[Download Extent Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})**" >> $GITHUB_STEP_SUMMARY