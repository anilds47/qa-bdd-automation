name: Run Browser Tests (Dynamic XML + Browser)

on:
  workflow_dispatch:
    inputs:
      testng_xml:
        description: 'Enter TestNG XML file path'
        required: true
        default: 'testng-bdd-web.xml'

      browser:
        description: 'Browser to run tests on'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox
          - edge

      headless:
        description: 'Run in headless mode?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  test:
    runs-on: self-hosted

    steps:
      # ✅ 1. Checkout PUBLIC repo (your test cases)
      - name: Checkout Public Repo
        uses: actions/checkout@v4

      # ✅ 2. Checkout PRIVATE repo (core framework)
      - name: Checkout Private Core Repo
        uses: actions/checkout@v4
        with:
          repository: anilds47/qa-core-framework
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: core-framework

      # ✅ 3. Cache Maven dependencies
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      # ✅ 4. Verify MySQL is Running (PowerShell)
      - name: Verify MySQL is Running
        run: |
          $ready = $false
          for ($i = 1; $i -le 15; $i++) {
            Write-Host "Attempt $i - pinging MySQL..."
            $result = & mysqladmin ping -h 127.0.0.1 -P 3306 -u ${{ secrets.DB_USER }} -p${{ secrets.DB_PASSWORD }} --silent 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host "MySQL is ready!"
              $ready = $true
              break
            }
            Write-Host "Waiting for MySQL..."
            Start-Sleep -Seconds 2
          }
          if (-not $ready) {
            Write-Host "MySQL did not respond in time."
            exit 1
          }
        shell: powershell

      # ✅ 5. Ensure DB and User exist
      - name: Configure MySQL
        run: |
          & mysql -h 127.0.0.1 -P 3306 -u root -p${{ secrets.DB_ROOT_PASSWORD }} -e "CREATE DATABASE IF NOT EXISTS ${{ secrets.DB_NAME }};"
          & mysql -h 127.0.0.1 -P 3306 -u root -p${{ secrets.DB_ROOT_PASSWORD }} -e "CREATE USER IF NOT EXISTS '${{ secrets.DB_USER }}'@'localhost' IDENTIFIED BY '${{ secrets.DB_PASSWORD }}';"
          & mysql -h 127.0.0.1 -P 3306 -u root -p${{ secrets.DB_ROOT_PASSWORD }} -e "GRANT ALL PRIVILEGES ON ${{ secrets.DB_NAME }}.* TO '${{ secrets.DB_USER }}'@'localhost'; FLUSH PRIVILEGES;"
          Write-Host "DB configured successfully."
        shell: powershell

      # ✅ 6. Apply Schema if exists
      - name: Run DB Schema / Seed Scripts
        run: |
          $schemaPath = "src/test/resources/db/schema.sql"
          if (Test-Path $schemaPath) {
            Write-Host "Applying schema from $schemaPath ..."
            $sql = Get-Content $schemaPath -Raw
            $sql | & mysql -h 127.0.0.1 -P 3306 -u ${{ secrets.DB_USER }} -p${{ secrets.DB_PASSWORD }} ${{ secrets.DB_NAME }}
            Write-Host "Schema applied successfully."
          } else {
            Write-Host "No schema.sql found - skipping."
          }
        shell: powershell

      # ✅ 7. Build Core Framework
      - name: Build Core Framework
        run: |
          cd core-framework
          mvn clean install -DskipTests
        shell: powershell

      # ✅ 8. Install Selected Browser
      - name: Install Chrome
        if: ${{ inputs.browser == 'chrome' }}
        uses: browser-actions/setup-chrome@v1

      - name: Install Firefox
        if: ${{ inputs.browser == 'firefox' }}
        uses: browser-actions/setup-firefox@v1

      - name: Install Edge
        if: ${{ inputs.browser == 'edge' }}
        uses: browser-actions/setup-edge@v1

      # ✅ 9. Debug Inputs
      - name: Debug Inputs
        run: |
          Write-Host "XML:      ${{ github.event.inputs.testng_xml }}"
          Write-Host "Browser:  ${{ github.event.inputs.browser }}"
          Write-Host "Headless: ${{ github.event.inputs.headless }}"
          Write-Host "XML Path: ${{ github.workspace }}/${{ github.event.inputs.testng_xml }}"
        shell: powershell

      # ✅ 10. Run Tests
      - name: Run Tests
        run: mvn clean test "-DsuiteXmlFile=${{ github.workspace }}/${{ inputs.testng_xml }}" "-Dbrowser=${{ inputs.browser }}" "-Dheadless=${{ inputs.headless }}"
        shell: powershell
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      # ✅ 11. Upload Extent Report artifact
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report-${{ github.run_number }}
          path: target/
          retention-days: 30

      # ✅ 12. Post Report Link to Job Summary
      - name: Post Report Link to Summary
        if: always()
        run: |
          echo "## 📊 Browser Test Report" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "| Input        | Value |" >> $env:GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $env:GITHUB_STEP_SUMMARY
          echo "| **XML File** | ``${{ inputs.testng_xml }}`` |" >> $env:GITHUB_STEP_SUMMARY
          echo "| **Br