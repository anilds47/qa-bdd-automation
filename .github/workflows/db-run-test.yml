name: MySQL Database Connection Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
      # ✅ 1. Checkout PUBLIC repo
      - name: Checkout Public Repo
        uses: actions/checkout@v4

      # ✅ 2. Checkout PRIVATE repo
      - name: Checkout Private Core Repo
        uses: actions/checkout@v4
        with:
          repository: anilds47/qa-core-framework
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: core-framework

      # ✅ 3. Set up JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ✅ 4. Cache Maven dependencies
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      # ✅ 5. Install MySQL using Chocolatey
      - name: Install MySQL
        run: |
          # Install chocolatey if not present
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            Set-ExecutionPolicy Bypass -Scope Process -Force
            [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
            iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          }
          
          # Install MySQL
          choco install mysql -y
          
          # Install MySQL service
          & "C:\Program Files\MySQL\MySQL Server 8.0\bin\mysqld.exe" --install
          
          Write-Host "MySQL installed successfully!"
        shell: powershell

      # ✅ 6. Start MySQL Service
      - name: Start MySQL Service
        run: |
          # Start MySQL service
          Start-Service MySQL
          
          # Wait for MySQL to start
          Start-Sleep -Seconds 15
          
          Write-Host "MySQL service started!"
        shell: powershell

      # ✅ 7. Configure MySQL (Set root password and create database)
      - name: Configure MySQL
        run: |
          $mysql = "C:\Program Files\MySQL\MySQL Server 8.0\bin\mysql.exe"
          
          # Set root password to 'root'
          & $mysql -u root -e "ALTER USER 'root'@'localhost' IDENTIFIED BY 'root';"
          
          # Create database
          & $mysql -u root -proot -e "CREATE DATABASE IF NOT EXISTS coviddata;"
          
          # Create europe table
          & $mysql -u root -proot -e "USE coviddata; CREATE TABLE IF NOT EXISTS europe (id INT AUTO_INCREMENT PRIMARY KEY, country VARCHAR(100), cases INT, date DATE);"
          
          Write-Host "✅ MySQL configured with database 'coviddata' and table 'europe'"
        shell: powershell

      # ✅ 8. Test Database Connection
      - name: Test Database Connection
        run: |
          $mysql = "C:\Program Files\MySQL\MySQL Server 8.0\bin\mysql.exe"
          
          Write-Host "=========================================" -ForegroundColor Yellow
          Write-Host "Testing Database Connection" -ForegroundColor Yellow
          Write-Host "=========================================" -ForegroundColor Yellow
          
          # Test basic connection
          Write-Host "`n1. Testing basic connection..." -ForegroundColor Cyan
          & $mysql -u root -proot -e "SELECT '✅ Database Connected Successfully!' as Status;"
          
          if ($LASTEXITCODE -eq 0) {
            Write-Host "✅ Basic connection successful!" -ForegroundColor Green
          } else {
            Write-Host "❌ Basic connection failed!" -ForegroundColor Red
            exit 1
          }
          
          # Check database
          Write-Host "`n2. Checking database: coviddata..." -ForegroundColor Cyan
          & $mysql -u root -proot -e "SELECT DATABASE() as Current_Database;" coviddata
          
          # Show all tables
          Write-Host "`n3. Listing all tables..." -ForegroundColor Cyan
          & $mysql -u root -proot -e "SHOW TABLES;" coviddata
          
          # Check europe table
          Write-Host "`n4. Checking 'europe' table..." -ForegroundColor Cyan
          & $mysql -u root -proot -e "SELECT COUNT(*) as Total_Rows FROM europe;" coviddata
          
          # Insert sample data
          Write-Host "`n5. Inserting sample data..." -ForegroundColor Cyan
          & $mysql -u root -proot -e "INSERT INTO europe (country, cases, date) VALUES ('United Kingdom', 1000000, '2024-01-01');" coviddata
          
          # Query the data
          Write-Host "`n6. Querying europe table..." -ForegroundColor Cyan
          & $mysql -u root -proot -e "SELECT * FROM europe;" coviddata
          
          # Get MySQL version
          Write-Host "`n7. MySQL Version:" -ForegroundColor Cyan
          & $mysql -u root -proot -e "SELECT VERSION() as Version;"
          
          Write-Host "`n=========================================" -ForegroundColor Green
          Write-Host "✅ All Database Connection Tests Passed!" -ForegroundColor Green
          Write-Host "=========================================" -ForegroundColor Green
        shell: powershell

      # ✅ 9. Run DB Schema (if exists)
      - name: Run DB Schema
        run: |
          $mysql = "C:\Program Files\MySQL\MySQL Server 8.0\bin\mysql.exe"
          $schemaPath = "src/test/resources/db/schema.sql"
          if (Test-Path $schemaPath) {
            Write-Host "Applying schema from $schemaPath ..." -ForegroundColor Yellow
            Get-Content $schemaPath -Raw | & $mysql -u root -proot coviddata
            Write-Host "✅ Schema applied successfully." -ForegroundColor Green
          } else {
            Write-Host "ℹ️ No schema.sql found - skipping." -ForegroundColor Yellow
          }
        shell: powershell

      # ✅ 10. Connection Summary
      - name: Connection Summary
        run: |
          Write-Host "`n=========================================" -ForegroundColor Magenta
          Write-Host "DATABASE CONNECTION SUMMARY" -ForegroundColor Magenta
          Write-Host "=========================================" -ForegroundColor Magenta
          Write-Host "✅ Database Server: MySQL 8.0"
          Write-Host "✅ Host: localhost:3306"
          Write-Host "✅ Database Name: coviddata"
          Write-Host "✅ Database User: root"
          Write-Host "✅ Table: europe (created)"
          Write-Host "✅ Connection Status: Active"
          Write-Host "=========================================" -ForegroundColor Green
          Write-Host "🎉 Database is ready for testing!" -ForegroundColor Green
        shell: powershell